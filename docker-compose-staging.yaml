services:

  nginx:
    image: nginx:stable-alpine
    container_name: nginx-ban
    restart: always
    ports:
      - "${PORT_NGINX:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/${NGINX_CONF_FILE:-default.conf}:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/logs:/var/log/nginx
    depends_on:
      - php
    networks:
      - appnetwork

  php:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_XDEBUG: ${INSTALL_XDEBUG:-false}
    container_name: php-ban
    restart: always
    working_dir: /var/www/html
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - appnetwork

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_XDEBUG: "false"
    container_name: horizon-ban
    restart: always
    command: php artisan horizon
    working_dir: /var/www/html
    environment:
      XDEBUG_MODE: "off"
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - appnetwork

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_XDEBUG: "false"
    container_name: scheduler-ban
    restart: always
    command: php artisan schedule:work
    working_dir: /var/www/html
    environment:
      XDEBUG_MODE: "off"
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - appnetwork

  redis:
    image: redis:8-alpine
    container_name: redis-ban
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - appnetwork

volumes:
  redis_data:

networks:
  appnetwork:
    external: true